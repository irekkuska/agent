services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 10 && ollama pull nomic-embed-text && wait"

  agent:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped
    volumes:
      - /tmp/syntelo-target-repo:/tmp/syntelo-target-repo
